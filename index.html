<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bisitahin Kami sa Facebook</title>
    <style>
        /* I-set ang background ng buong page gamit ang isang larawan */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* Dito ilalagay ang link ng iyong background picture */
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDXm1-czC5jCHMLEX6NLI8cLrrF5hHqOqWhw&s'); 
            
            /* Siguraduhin na ang larawan ay maayos na nakalagay */
            background-size: cover; /* Pinupuno ang buong screen */
            background-position: center; /* Gitna ang focus */
            background-repeat: no-repeat; /* Hindi inuulit ang larawan */
            background-attachment: fixed; /* Hindi gumagalaw ang background kapag nag-scroll */

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Disenyo ng Card (Bahagyang translucent para makita ang background) */
        .fb-card {
            background-color: rgba(255, 255, 255, 0.95); /* Puti na may kaunting transparency */
            border-radius: 16px; /* Mas pinalambot na kanto */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); /* Mas malalim na shadow para lumutang */
            padding: 40px 30px;
            text-align: center;
            max-width: 350px;
            width: 90%; /* Responsive sa mobile */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Effect kapag itinapat ang mouse sa card */
        .fb-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        /* Disenyo ng Logo placeholder (Bilog) */
        .profile-pic {
            width: 80px;
            height: 80px;
            background-color: #1877f2;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3);
        }

        /* Pangalan ng Page */
        .page-title {
            font-size: 24px;
            color: #050505;
            margin: 0 0 12px 0;
            font-weight: bold;
        }

        /* Deskripsyon sa ilalim ng pangalan */
        .page-desc {
            font-size: 15px;
            color: #4e5157;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Disenyo ng Button (Facebook Blue) */
        .fb-btn {
            display: inline-block;
            text-decoration: none;
            background-color: #1877f2; /* Official FB Blue */
            color: white;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
            width: 85%;
        }

        /* Effect kapag tinapatan o kinlik ang button */
        .fb-btn:hover {
            background-color: #166fe5;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.4);
        }

        .fb-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Dito nagsisimula ang Card UI -->
    <div class="fb-card">
        <!-- Logo/Icon ng Card -->
        <div class="profile-pic">f</div>
        
        <!-- Detalye ng iyong Page -->
        <h2 class="page-title">Ang Iyong Page</h2>
        <p class="page-desc">I-like at i-follow ang aming opisyal na FB Page ng DGDLFCI para sa mga pinakabagong update at balita!</p>
        
        <!-- Ang Button Link (Palitan ang 'PAGENAME' ng totoong FB link mo) -->
        <a href="https://www.facebook.com/drglorialacsconofficialsanleonardo" target="_blank" class="fb-btn">
            Visit Our Page!
        </a>
    </div>

</body>
</html>
